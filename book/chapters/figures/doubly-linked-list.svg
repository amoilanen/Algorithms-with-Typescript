<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="dll-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="dll-arrow-prev" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" />
    </marker>
    <marker id="dll-arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="dll-arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="240" fill="#fafafa" rx="8" />

  <!-- ===== Caption ===== -->
  <text x="360" y="24" text-anchor="middle" font-size="13" fill="#475569" font-style="italic">
    Every node also stores a prev pointer; the first node's prev and the last node's next are null.
  </text>

  <!-- ===== head pointer (points right into node 1) ===== -->
  <text x="50" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">head</text>
  <line x1="80" y1="115" x2="128" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#dll-arrow-blue)" />

  <!-- ===== Node 1: value 10 ===== -->
  <g transform="translate(130, 80)">
    <!-- prev cell (null) -->
    <rect x="0" y="0" width="40" height="70" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="4" />
    <text x="20" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">null</text>
    <text x="20" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">prev</text>
    <!-- value cell -->
    <rect x="40" y="0" width="60" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2" rx="4" />
    <text x="70" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">10</text>
    <text x="70" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">value</text>
    <!-- next cell -->
    <rect x="100" y="0" width="40" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2" rx="4" />
    <text x="120" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">next</text>
  </g>

  <!-- ===== Node 2: value 20 ===== -->
  <g transform="translate(310, 80)">
    <!-- prev cell -->
    <rect x="0" y="0" width="40" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2" rx="4" />
    <text x="20" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">prev</text>
    <!-- value cell -->
    <rect x="40" y="0" width="60" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2" rx="4" />
    <text x="70" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">20</text>
    <text x="70" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">value</text>
    <!-- next cell -->
    <rect x="100" y="0" width="40" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2" rx="4" />
    <text x="120" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">next</text>
  </g>

  <!-- ===== Node 3: value 30 ===== -->
  <g transform="translate(490, 80)">
    <!-- prev cell -->
    <rect x="0" y="0" width="40" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2" rx="4" />
    <text x="20" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">prev</text>
    <!-- value cell -->
    <rect x="40" y="0" width="60" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2" rx="4" />
    <text x="70" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">30</text>
    <text x="70" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">value</text>
    <!-- next cell (null) -->
    <rect x="100" y="0" width="40" height="70" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="4" />
    <text x="120" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">null</text>
    <text x="120" y="-8" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">next</text>
  </g>

  <!-- ===== inter-node links (drawn on top so they stay visible back to their dots) ===== -->
  <!-- next (forward) links on the upper lane -->
  <line x1="250" y1="104" x2="308" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#dll-arrow)" />
  <line x1="430" y1="104" x2="488" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#dll-arrow)" />
  <!-- prev (backward) links on the lower lane -->
  <line x1="330" y1="126" x2="272" y2="126" stroke="#7c3aed" stroke-width="2" marker-end="url(#dll-arrow-prev)" />
  <line x1="510" y1="126" x2="452" y2="126" stroke="#7c3aed" stroke-width="2" marker-end="url(#dll-arrow-prev)" />

  <!-- pointer dots, drawn last so each sits exactly at its link's origin -->
  <circle cx="250" cy="104" r="5" fill="#92400e" />
  <circle cx="430" cy="104" r="5" fill="#92400e" />
  <circle cx="330" cy="126" r="5" fill="#92400e" />
  <circle cx="510" cy="126" r="5" fill="#92400e" />

  <!-- ===== tail pointer (points up into node 3) ===== -->
  <line x1="560" y1="200" x2="560" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#dll-arrow-green)" />
  <text x="560" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">tail</text>
</svg>
